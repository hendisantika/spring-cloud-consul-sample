version: 2
updates:
  # Maven dependencies for every microservice
  - package-ecosystem: maven
    directories:
      - "/account-service"
      - "/customer-service"
      - "/gateway-service"
      - "/order-service"
      - "/product-service"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    target-branch: main
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
      include: scope
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
      spring-cloud:
        patterns:
          - "org.springframework.cloud*"
      testcontainers:
        patterns:
          - "org.testcontainers*"
      test-libraries:
        dependency-type: development
        patterns:
          - "io.specto*"
          - "org.junit*"
          - "org.mockito*"
        update-types:
          - minor
          - patch
      maven-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "org.springframework.boot*"
          - "org.springframework.cloud*"
          - "org.testcontainers*"
        update-types:
          - minor
          - patch

  # GitHub Actions used by the CI workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
